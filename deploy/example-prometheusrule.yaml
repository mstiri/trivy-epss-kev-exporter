# EXAMPLE alerting rules — NOT applied by kustomization.yaml. The exporter emits
# no alerts itself; alerting policy lives here, keyed off the metric contract.
# Tune thresholds/severities to your environment before using.
#
# Each expr wraps the metric in `max without (pod, instance) (...)` so the alert
# identity ignores the exporter's pod name / IP. Without this, redeploying the
# exporter (new pod ⇒ new pod/instance labels) changes every alert's fingerprint,
# resolving the old alerts and restarting each `for:` window from scratch. The
# raw series keep pod/instance (they disambiguate the two pods that briefly
# coexist during a rolling update); only the alert query aggregates them away.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-epss-kev-exporter-example
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-epss-kev-exporter
    app.kubernetes.io/part-of: trivy
spec:
  groups:
    - name: trivy-vuln.rules
      rules:
        # A known-exploited (CISA KEV) CVE is present on a workload.
        - alert: KnownExploitedVulnPresent
          expr: max without (pod, instance) (trivy_vuln_kev) == 1
          for: 15m
          labels:
            severity: critical
            source: trivy-epss-kev-exporter
          annotations:
            summary: "KEV CVE {{ $labels.cve }} on {{ $labels.namespace }}/{{ $labels.workload }}"
            description: "{{ $labels.cve }} ({{ $labels.severity }}) in package `{{ $labels.resource }}` is in the CISA KEV catalog."

        # KEV CVE linked to a known ransomware campaign — highest priority.
        - alert: RansomwareKnownExploitedVuln
          expr: max without (pod, instance) (trivy_vuln_kev_ransomware) == 1
          for: 5m
          labels:
            severity: critical
            source: trivy-epss-kev-exporter
          annotations:
            summary: "Ransomware-linked KEV CVE {{ $labels.cve }} on {{ $labels.namespace }}/{{ $labels.workload }}"
            description: "{{ $labels.cve }} ({{ $labels.severity }}) in package `{{ $labels.resource }}` on {{ $labels.namespace }}/{{ $labels.workload }} is a CISA KEV entry linked to a known ransomware campaign — prioritize remediation."

        # High predicted exploitation probability (EPSS score over threshold).
        - alert: HighEPSSScore
          expr: max without (pod, instance) (trivy_vuln_epss_score) > 0.5
          for: 1h
          labels:
            severity: warning
            source: trivy-epss-kev-exporter
          annotations:
            summary: 'High EPSS ({{ $value | printf "%.2f" }}) for {{ $labels.cve }} on {{ $labels.namespace }}/{{ $labels.workload }}'
            description: '{{ $labels.cve }} ({{ $labels.severity }}) in package `{{ $labels.resource }}` on {{ $labels.namespace }}/{{ $labels.workload }} has an EPSS exploitation probability of {{ $value | printf "%.2f" }} (threshold 0.5).'

        # Top-percentile EPSS (most-likely-exploited tail), threshold-independent.
        - alert: HighEPSSPercentile
          expr: max without (pod, instance) (trivy_vuln_epss_percentile) > 0.95
          for: 1h
          labels:
            severity: warning
            source: trivy-epss-kev-exporter
          annotations:
            summary: "Top-5% EPSS for {{ $labels.cve }} on {{ $labels.namespace }}/{{ $labels.workload }}"
            description: "{{ $labels.cve }} ({{ $labels.severity }}) in package `{{ $labels.resource }}` on {{ $labels.namespace }}/{{ $labels.workload }} is in the top 5% of CVEs by EPSS percentile ({{ $value | humanizePercentage }})."

    - name: trivy-exporter.operational.rules
      rules:
        # A feed has not refreshed successfully in too long → enrichment is stale.
        - alert: ExporterFeedStale
          expr: time() - max without (pod, instance) (trivy_exporter_feed_last_success_timestamp_seconds) > 36 * 3600
          for: 30m
          labels:
            severity: warning
            source: trivy-epss-kev-exporter
          annotations:
            summary: "EPSS/KEV feed '{{ $labels.feed }}' has not refreshed in over 36h"
            description: "The '{{ $labels.feed }}' feed has not refreshed successfully in over 36h, so EPSS/KEV enrichment may be stale. Check trivy_exporter_feed_refresh_failures_total and the exporter logs."

        # The informer cache never synced → vuln series may be missing/incomplete.
        - alert: ExporterCacheNotSynced
          expr: max without (pod, instance) (trivy_exporter_cache_synced) == 0
          for: 15m
          labels:
            severity: warning
            source: trivy-epss-kev-exporter
          annotations:
            summary: "trivy-epss-kev-exporter informer cache is not synced"
            description: "The exporter's VulnerabilityReport informer cache has not synced, so vuln series may be missing or incomplete. Check the exporter pod's connectivity to the Kubernetes API and its logs."
